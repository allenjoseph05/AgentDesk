[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdesk"
version = "0.1.0"
description = "Adaptive multi-agent research workspace built around A2A and A2UI"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "a2a-sdk[fastapi]==1.1.2",
    "a2ui-core==0.1.1",
    "ag-ui-protocol==0.1.20",
    "alembic==1.18.5",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "SQLAlchemy==2.0.51",
    "uvicorn[standard]==0.52.3",
]

[project.optional-dependencies]
dev = [
    "mypy==1.19.1",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.setuptools.packages.find]
include = ["agents*", "packages*"]

[tool.setuptools.package-data]
"packages.persistence" = [
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/versions/*.py",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
xfail_strict = true
markers = [
    "a2a_contract: exercises Agent Cards and official A2A task, stream, context, and cancellation boundaries",
    "agui_contract: exercises official AG-UI encoding, lifecycle, state, action, cancellation, and recovery boundaries",
]

[tool.mypy]
python_version = "3.14"
files = ["agents", "packages"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
