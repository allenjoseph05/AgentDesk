[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdesk-scoper"
version = "0.2.0"
description = "Isolated Google ADK decision-scoping A2A service for AgentDesk"
requires-python = ">=3.14,<3.15"
dependencies = [
    "a2a-sdk[fastapi]==1.1.2",
    "google-adk[a2a]==2.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
