name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agentdesk
          POSTGRES_USER: agentdesk
          POSTGRES_PASSWORD: agentdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentdesk -d agentdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --workspaces --include-workspace-root
      - run: python scripts/setup.py
      - name: Python lint and formatting
        run: npm run lint:python
      - name: Python type checking
        run: npm run typecheck:python
      - name: Apply database migrations
        run: python scripts/run_python.py -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://agentdesk:agentdesk@127.0.0.1:5432/agentdesk
      - name: A2A contract tests
        run: npm run test:a2a
      - name: AG-UI contract tests
        run: npm run test:agui
      - name: Python tests
        run: npm run test:python
      - name: Frontend lint
        run: npm run lint:web
      - name: Frontend type checking
        run: npm run typecheck:web
      - name: Frontend catalog and schema contracts
        run: npm run test:contracts --workspace @agentdesk/web
      - name: Frontend tests
        run: npm run test:web
      - name: Frontend build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Golden browser E2E
        run: npm run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  adaptive-intake-compatibility:
    name: Adaptive intake compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            services/scoper/requirements.lock
            spikes/a2ui-python/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: spikes/a2ui-web/package-lock.json
      - name: Install isolated resolver
        run: python -m pip install uv==0.11.32
      - name: Create isolated scoper environment
        run: |
          python -m venv .venv-scoper
          uv pip sync --python .venv-scoper/bin/python services/scoper/requirements.lock
      - name: Lint and test ADK A2A compatibility
        run: |
          .venv-scoper/bin/python -m ruff check services/scoper spikes/a2ui-python/tests
          .venv-scoper/bin/python -m ruff format --check services/scoper spikes/a2ui-python/tests
          PYTHONPATH=services/scoper/src .venv-scoper/bin/python -m pytest services/scoper/tests
      - name: Create isolated A2UI Python environment
        run: |
          python -m venv .venv-a2ui-python
          uv pip sync --python .venv-a2ui-python/bin/python spikes/a2ui-python/requirements.lock
      - name: Test A2UI Python compatibility
        run: .venv-a2ui-python/bin/python -m pytest spikes/a2ui-python/tests
      - name: Install and test A2UI web compatibility
        run: |
          npm ci --ignore-scripts --prefix spikes/a2ui-web
          npm test --prefix spikes/a2ui-web
          npm audit --audit-level=low --prefix spikes/a2ui-web

  adaptive-intake-e2e:
    name: Adaptive intake fixture E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            services/scoper/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --workspaces --include-workspace-root
      - run: python scripts/setup.py
      - name: Create isolated scoper environment
        run: python scripts/setup_adaptive_intake_e2e.py
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run key-free adaptive intake stack
        run: npm run test:e2e:intake
      - name: Upload adaptive intake failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-intake-playwright-${{ github.run_id }}
          path: |
            .tmp/intake-playwright-report
            .tmp/intake-test-results
          if-no-files-found: ignore
          retention-days: 7

  container-images:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHON_IMAGE: agentdesk-python:${{ github.sha }}
      WEB_IMAGE: agentdesk-web:${{ github.sha }}
      IMAGE_SECRET_SENTINEL: agentdesk-ci-local-secret-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Seed ignored local-secret sentinel
        run: printf 'LOCAL_ONLY_SECRET=%s\n' "$IMAGE_SECRET_SENTINEL" > .env
      - name: Build runtime images
        run: |
          docker build --tag "$PYTHON_IMAGE" .
          docker build --file apps/web/Dockerfile --tag "$WEB_IMAGE" .
      - name: Verify local secret is absent from image layers
        run: python scripts/verify_image_secrets.py "$PYTHON_IMAGE" "$WEB_IMAGE"
      - name: Prepare vulnerability reports
        run: mkdir -p reports
      - name: Inspect Python image dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.PYTHON_IMAGE }}
          format: json
          output: reports/python-vulnerabilities.json
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          version: v0.72.0
      - name: Inspect web image dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.WEB_IMAGE }}
          format: json
          output: reports/web-vulnerabilities.json
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          version: v0.72.0
          skip-setup-trivy: true
      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-vulnerability-reports-${{ github.run_id }}
          path: reports/*.json
          if-no-files-found: error
          retention-days: 14
