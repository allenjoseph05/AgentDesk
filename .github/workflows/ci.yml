name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agentdesk
          POSTGRES_USER: agentdesk
          POSTGRES_PASSWORD: agentdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentdesk -d agentdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --workspaces --include-workspace-root
      - run: python scripts/setup.py
      - name: Python lint and formatting
        run: npm run lint:python
      - name: Python type checking
        run: npm run typecheck:python
      - name: Apply database migrations
        run: python scripts/run_python.py -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://agentdesk:agentdesk@127.0.0.1:5432/agentdesk
      - name: A2A contract tests
        run: npm run test:a2a
      - name: AG-UI contract tests
        run: npm run test:agui
      - name: Python tests
        run: npm run test:python
      - name: Frontend lint
        run: npm run lint:web
      - name: Frontend type checking
        run: npm run typecheck:web
      - name: Frontend catalog and schema contracts
        run: npm run test:contracts --workspace @agentdesk/web
      - name: Frontend tests
        run: npm run test:web
      - name: Frontend build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Golden browser E2E
        run: npm run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
