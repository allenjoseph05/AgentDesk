name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agentdesk
          POSTGRES_USER: agentdesk
          POSTGRES_PASSWORD: agentdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentdesk -d agentdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --workspaces --include-workspace-root
      - run: python scripts/setup.py
      - run: npm run lint
      - run: npm run typecheck
      - run: python scripts/run_python.py -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://agentdesk:agentdesk@127.0.0.1:5432/agentdesk
      - run: npm test
      - run: npm run build
